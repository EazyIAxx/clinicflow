name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # Segredos de placeholder: lint/build não abrem conexão real com nenhum
    # serviço, só precisam que as variáveis existam pra não quebrar na
    # avaliação de módulo (ex.: `process.env.X!`). Nenhum segredo real do
    # Supabase/Resend/produção fica exposto ao CI.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/clinicflow"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
      RESEND_API_KEY: "placeholder"
      RESEND_FROM_EMAIL: "placeholder@example.com"
      CRON_SECRET: "placeholder-cron-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # `npm ci` já dispara `prisma generate` via postinstall (package.json).
      - run: npm ci

      - run: npm run lint

      - run: npm run build
